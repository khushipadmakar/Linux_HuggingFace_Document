name: CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn[standard] gunicorn python-multipart pydantic sqlalchemy psycopg2-binary pgvector python-dotenv requests numpy pypdf python-docx alembic pytest httpx transformers sentence-transformers torch
          

      - name: Run backend tests
        env:
          AIDOC_DATABASE_URL: sqlite:///./ci_test.db
          AIDOC_UPLOAD_ROOT: storage/uploads
          AIDOC_LOG_ROOT: storage/logs
        run: pytest backend/tests -q

frontend-build:
  runs-on: ubuntu-latest
  defaults:
    run:
      working-directory: frontend

  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install dependencies (clean)
      run: npm ci

    - name: Fix vite permissions (important fix)
      run: chmod +x node_modules/.bin/vite || true

    - name: Build frontend
      run: npm run build